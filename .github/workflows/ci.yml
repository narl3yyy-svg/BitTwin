name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 LTS (Qt 6.4, Paramiko 2.x) and 26.04 LTS (Qt 6.10, Paramiko 4.x)
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Install the same Ubuntu packages run.sh uses
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then SVG=qt6-svg-plugins; else SVG=libqt6svg6; fi
          echo "SVG plugin package: $SVG"
          apt-get install -y --no-install-recommends git ca-certificates \
            python3 python3-pyqt6 python3-paramiko python3-keyring "$SVG" openssh-client
      - uses: actions/checkout@v4
      - name: Run the test suite (engine, SFTP, security, headless GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -v

  lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (run.sh, install.sh, tools/)
        run: |
          # Findings are also turned into annotations so they are visible without signing in.
          if ! shellcheck -f gcc run.sh install.sh tools/*.sh > shellcheck.txt; then
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::error file=\1,line=\2,col=\3::\5/' shellcheck.txt
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit (Python security scanner)
        run: |
          python -m pip install --quiet bandit
          if ! bandit -r bittwin --severity-level medium --confidence-level medium -f custom \
              --msg-template '::error file={relpath},line={line}::{test_id} {msg}'; then
            exit 1
          fi
